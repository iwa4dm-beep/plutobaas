name: Starter E2E (Auth + RLS + Webhooks)

on:
  push:
    paths:
      - "examples/nextjs-starter/**"
      - ".github/workflows/starter-e2e.yml"
  pull_request:
    paths:
      - "examples/nextjs-starter/**"
      - ".github/workflows/starter-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/nextjs-starter
    env:
      NEXT_PUBLIC_PLUTO_URL: ${{ secrets.PLUTO_URL }}
      NEXT_PUBLIC_PLUTO_ANON_KEY: ${{ secrets.PLUTO_ANON_KEY }}
      PLUTO_SERVICE_ROLE_KEY: ${{ secrets.PLUTO_SERVICE_ROLE_KEY }}
      PLUTO_WEBHOOK_SECRET: ${{ secrets.PLUTO_WEBHOOK_SECRET }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      STARTER_URL: http://localhost:3000
      CI: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: examples/nextjs-starter/package-lock.json

      - name: Preflight — required secrets
        run: |
          missing=()
          for v in PLUTO_URL PLUTO_ANON_KEY PLUTO_WEBHOOK_SECRET; do
            [ -n "${!v:-}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing GitHub secrets: ${missing[*]} — tests requiring these will skip."
          fi
        env:
          PLUTO_URL: ${{ secrets.PLUTO_URL }}
          PLUTO_ANON_KEY: ${{ secrets.PLUTO_ANON_KEY }}
          PLUTO_WEBHOOK_SECRET: ${{ secrets.PLUTO_WEBHOOK_SECRET }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build starter
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/nextjs-starter/playwright-report
          if-no-files-found: ignore
          retention-days: 7
